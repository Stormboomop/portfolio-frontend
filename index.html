<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R. Suzzjal Saee</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
</head>

<body>

<nav>
    <div class="logo">RS</div>

    <ul>
        <li><a href="#about">About</a></li>
        <li><a href="#work">Work</a></li>
        <li><a href="#contact">Contact</a></li>
    </ul>
</nav>

<section class="hero">

    <div class="overlay"></div>

    <div class="hero-content">

        <p class="small">VIDEO EDITOR</p>

        <h1 id="name"></h1>

        <p id="tagline" class="tagline"></p>

        <a href="#work" class="btn">
            View Work
        </a>

    </div>

</section>

<section id="about" class="about">

    <h2>About</h2>

    <img
    src="assets/profile.jpg"
    alt="Profile"
    class="profile-pic">

    <p id="about-text"></p>

</section>

<section id="work" class="work">

    <h2>My Work</h2>

    <div id="work-grid" class="grid"></div>

</section>

<section id="contact" class="contact">

    <h2>Let's Connect</h2>

    <div class="links">

        <a id="email-btn">Email</a>

        <a
        id="insta-btn"
        target="_blank">
        Instagram
        </a>

    </div>

</section>


<script src="script.js"></script>

</body>
</html>
