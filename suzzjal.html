<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    color:white;
}

.login-box{
    background:#1b1b1b;
    padding:30px;
    width:350px;
    border-radius:10px;
}

input{

    width:100%;
    padding:12px;
    margin:10px 0;
    box-sizing:border-box;

}

button{

    width:100%;
    padding:12px;
    cursor:pointer;
    background:#4D8DFF;
    color:white;
    border:none;

}

</style>

</head>
<body>

<div class="login-box">

<h2>Portfolio Admin</h2>

<input
id="username"
placeholder="Username">

<input
id="password"
type="password"
placeholder="Password">

<button onclick="login()">

Login

</button>

</div>

<script>

async function login(){

    const username =
    document.getElementById("username").value;

    const password =
    document.getElementById("password").value;

    const response =
    await fetch(

        "https://portfolio-backend-tpo1.onrender.com/api/auth/login",

        {

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                username,
                password

            })

        }

    );

    const data =
    await response.json();

    if(data.token){

        localStorage.setItem(

            "token",

            data.token

        );

        window.location.href =
        "admin/dashboard.html";

    }

    else{

        alert(data.message);

    }

}

</script>

</body>
</html>
